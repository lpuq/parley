[package]
name = "parley"
version = "0.1.0"
edition = "2024"
description = "Private, serverless voice/video/screen-share calls for Linux"
license = "GPL-3.0-or-later"

[dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["full"] }
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "background"] }
pipewire = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
async-channel = "2"
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
ksni = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
