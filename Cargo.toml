[package]
name = "parley"
version = "0.12.2"
edition = "2024"
description = "Private, serverless voice/video/screen-share calls for Linux"
license = "GPL-3.0-or-later"

[dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["full"] }
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
async-channel = "2"
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nnnoiseless = { version = "0.5.2", default-features = false }

# Linux desktop integration: screen-capture and background portals, PipeWire app-audio
# routing, and the StatusNotifierItem tray.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "background"] }
pipewire = "0.10"
ksni = "0.3"

# Windows: the notification-area (tray) icon.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
# (The version tray-icon uses.)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
